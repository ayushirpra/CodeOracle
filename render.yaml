services:
  - type: web
    name: codeoracle-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "https://codeoracle-frontend.onrender.com,http://localhost:5173"

  - type: web
    name: codeoracle-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://codeoracle-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

